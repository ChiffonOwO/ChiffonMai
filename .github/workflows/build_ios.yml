name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时自动触发

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest  # GitHub 的 macOS 云环境

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'   # 与本地开发环境一致的 Flutter 版本
          channel: 'stable'

      - name: 安装依赖
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      # ---- 构建未签名 App ----
      # flutter build ios 会因未配置 Development Team 而强制失败（工具链检查，
      # 与 Xcode 签名设置无关），因此改用 xcodebuild 直接构建。
      # 注意：Runner 里的 Flutter Run Script 需要 $FLUTTER_ROOT，
      # 它由 flutter 命令注入、裸 xcodebuild 不会自动带上，需手动导出。
      - name: 构建未签名 iOS App
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          ls -la build/ios/Build/Products/Release-iphoneos/

      # ---- 手动组装未签名 IPA ----
      # 未签名产物是 Runner.app，需手动用 zip 打包成 .ipa。
      - name: 打包为未签名 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r app-unsigned.ipa Payload

      # ---- 上传 IPA ----
      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned.ipa
          path: app-unsigned.ipa
