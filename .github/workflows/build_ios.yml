name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时自动触发

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest  # GitHub 的 macOS 云环境

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'   # 与本地开发环境一致的 Flutter 版本
          channel: 'stable'

      - name: 安装依赖
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      # ---- 用 GitHub Secrets 生成 DeveloperToken.dart ----
      # 该文件含敏感凭据，已被 .gitignore 排除、绝不入库。
      # 在 CI 里用仓库 Secrets 动态生成，供编译使用。
      - name: 生成 DeveloperToken.dart（来自 Secrets）
        run: |
          cat > lib/api/DeveloperToken.dart <<'EOF'
          // ignore_for_file: constant_identifier_names

          class DeveloperToken {
            static const String TencentSecretId = '${{ secrets.TENCENT_SECRET_ID }}';
            static const String TencentSecretKey = '${{ secrets.TENCENT_SECRET_KEY }}';

            // 落雪 OAuth Client Secret
            static const String LuoXueClientSecret = '${{ secrets.LUOXUE_CLIENT_SECRET }}';

            // MySQL数据库配置
            static const String MySQLHost = '${{ secrets.MYSQL_HOST }}';
            static const int MySQLPort = ${{ secrets.MYSQL_PORT }};
            static const String MySQLDatabase = '${{ secrets.MYSQL_DATABASE }}';
            static const String MySQLUsername = '${{ secrets.MYSQL_USERNAME }}';
            static const String MySQLPassword = '${{ secrets.MYSQL_PASSWORD }}';

            // Redis配置
            static const String RedisHost = '${{ secrets.REDIS_HOST }}';
            static const int RedisPort = ${{ secrets.REDIS_PORT }};
            static const String RedisPassword = '${{ secrets.REDIS_PASSWORD }}';
            static const int RedisDatabase = ${{ secrets.REDIS_DATABASE }};
          }
          EOF
          echo "Debug: DeveloperToken.dart 生成结果如下（密钥部分已打码以便核对格式）:"
          sed -E "s|('.*SecretKey' *= *').*|\1***|; s|('.*Password' *= *').*|\1***|" lib/api/DeveloperToken.dart

      # ---- 构建未签名 App ----
      # flutter build ipa --no-codesign：可成功归档，但工具链会因未配置
      # Development Team 而让命令以非 0 退出（产物其实已生成）。用
      # continue-on-error 跳过，随后从归档产物组装 .app。
      - name: 构建未签名 iOS App（归档）
        continue-on-error: true
        run: |
          flutter build ipa --release --no-codesign
          echo "=== exit code above (非0=仅Team检查失败，产物仍在) ==="

      # ---- 组装未签名 IPA ----
      # 从 archive 产物里取未签名 Runner.app 并打包成 .ipa。
      - name: 组装未签名 IPA
        run: |
          APP_ARCHIVE="$(find build/ios/archive -name 'Runner.xcarchive' -type d | head -1)"
          echo "archive: $APP_ARCHIVE"
          mkdir -p Payload
          cp -r "$APP_ARCHIVE/Products/Applications/Runner.app" Payload/
          zip -r app-unsigned.ipa Payload

      # ---- 上传 IPA ----
      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned.ipa
          path: app-unsigned.ipa
