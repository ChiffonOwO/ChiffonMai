name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时自动触发

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest  # GitHub 的 macOS 云环境

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'   # 与本地开发环境一致的 Flutter 版本
          channel: 'stable'

      - name: 安装依赖
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      # ---- 构建未签名 App ----
      # Xcode 构建本身成功（build/ios/iphoneos/Runner.app 已产出）。
      # Flutter 工具随后会因缺少 DEVELOPMENT_TEAM 而报错（--no-codesign 也拦），
      # 但 .app 早已存在于磁盘上，所以用 continue-on-error 跳过该检查。
      - name: 构建未签名 iOS App
        continue-on-error: true
        run: |
          flutter build ios --release --no-codesign

      # ---- 手动组装未签名 IPA ----
      # 未签名产物是 Runner.app，需手动用 zip 打包成 .ipa。
      - name: 打包为未签名 IPA
        run: |
          ls -la build/ios/iphoneos/
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-unsigned.ipa Payload

      # ---- 上传 IPA ----
      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned.ipa
          path: app-unsigned.ipa
